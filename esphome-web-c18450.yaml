# ── Sensors ───────────────────────────────────────────────────────────────────

sensor:
  - platform: sht4x
    temperature:
      name: "Room Temperature"
      id: local_temp
      unit_of_measurement: "°C"
    humidity:
      name: "Room Humidity"
      id: local_humidity
    address: 0x44
    update_interval: 15s

  - platform: template
    name: "Battery Voltage"
    id: battery_mv
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // Read VBAT from M5PM1 register 0x22 (16-bit little-endian, value in mV)
      // Take 5 readings and return median to reject ADC glitches
      auto *bus = id(i2c_bus);
      const uint8_t addr = 0x6E;
      uint16_t readings[5];
      for (int i = 0; i < 5; i++) {
        uint8_t reg = 0x22;
        uint8_t data[2] = {0, 0};
        bus->write(addr, &reg, 1, false);
        bus->read(addr, data, 2);
        readings[i] = data[0] | (data[1] << 8);
        delay(10);
      }
      // Sort and return median (index 2)
      for (int i = 0; i < 4; i++)
        for (int j = i+1; j < 5; j++)
          if (readings[i] > readings[j]) { uint16_t t = readings[i]; readings[i] = readings[j]; readings[j] = t; }
      uint16_t mv = readings[2];
      if (mv < 3000) return {};  // reject invalid readings
      return (float)mv;


  - platform: copy
    source_id: battery_mv
    name: "Battery"
    id: battery_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    # Piecewise linear approximation of LiPo discharge curve for 1S 1250mAh cell.
    # Calibration points derived from actual discharge data on this device.
    # Tune by noting mV readings at known states and updating points below, then OTA flash.
    # Calibrated from full discharge run Jun 5–7 2026 (5-min sleep intervals, 1250mAh cell).
    # Cliff confirmed at ~3300 mV; effective PMIC cutoff at ~3000–3018 mV under load.
    # NOTE: calibrate_linear with multiple points does a global least-squares fit (not piecewise),
    # so a lambda filter is used here to implement true piecewise linear interpolation.
    # 4160 mV = measured resting OCV after full charge (USB removed). 4244 mV anchor covers charger-maintained voltage.
    # Curve derived from history-24.csv full discharge run (Jun 5–7 2026, 43.93 hrs total), then rescaled so that
    # 3350 mV = 0% (low-battery shutdown threshold) and 4160 mV = 100%. Users see 0% when the device shuts down,
    # not a confusing ~8%. Each anchor = rescaled fraction of usable capacity remaining at that voltage.
    filters:
      - lambda: |-
          struct Pt { float x, y; };
          static const Pt pts[] = {
            {3000, 0}, {3350, 0}, {3400, 5}, {3500, 13},
            {3600, 28}, {3700, 42}, {3800, 53}, {3900, 62},
            {4000, 78}, {4080, 96}, {4160, 100}, {4244, 100}
          };
          const int n = sizeof(pts) / sizeof(pts[0]);
          if (x <= pts[0].x) return 0.0f;
          if (x >= pts[n-1].x) return 100.0f;
          for (int i = 1; i < n; i++) {
            if (x <= pts[i].x) {
              float t = (x - pts[i-1].x) / (pts[i].x - pts[i-1].x);
              return pts[i-1].y + t * (pts[i].y - pts[i-1].y);
            }
          }
          return 100.0f;
      - clamp:
          min_value: 0
          max_value: 100

  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: !secret ha_outdoor_temp_entity
    on_value:
      then:
        - if:
            condition:
              # Only trigger if the -200 boot sequence's wait_until has already given up
              # (timed out) and rendered without this sensor — NOT merely "25s have elapsed,"
              # since that can be true while wait_until is still actively polling, racing its
              # own component.update call (confirmed bug: "Display already in state UPDATE",
              # Jun 2026 — outdoor temp arrived ~175ms after HA API connect, landing inside the
              # wait_until poll window instead of after a genuine timeout).
              lambda: 'return !id(initial_display_done) && !id(waiting_for_sensors) && millis() > 25000;'
            then:
              - lambda: 'id(initial_display_done) = true;'
              - logger.log: "Outdoor temp arrived after timeout — refreshing display"
              - component.update: battery_mv
              - component.update: wifi_signal_db
              - component.update: m5_color_screen

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 600s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic
    device_class: ""

# HA nordpool prices are in diagnostic section text_sensor part


# ── Scripts ───────────────────────────────────────────────────────────────────
script:
  # ── PMIC full shutdown ───────────────────────────────────────────────────────
  # Programs M5PM1 internal wake timer (regs 0x38–0x3D) then issues SYS_CMD_OFF
  # (reg 0x0C = 0xA1), cutting all power including the ESP32's 3V3_L2 rail.
  # The PMIC self-restarts after wake_seconds, producing a full cold boot.
  #
  # This achieves ~92 µA standby (product spec) vs ~5-10 mA with ESP32 deep sleep.
  # Empirically confirmed: ESP32 deep sleep provides no meaningful power reduction
  # on this hardware — PMIC + IT8951E controller dominate at ~5-10 mA regardless
  # of sleep interval (5-min and 30-min discharge runs showed identical drain rates).
  #
  # Fail-safe: reads back reg 0x3C after arm — if != 0x0B, aborts and stays awake.
  # If shutdown fails the device stays on (WiFi + HA keep it alive).
  - id: pmic_shutdown
    mode: single
    parameters:
      wake_seconds: uint32_t
    then:
      # Clear the powered-on indicator before the power rail dies
      - light.turn_off: leds
      - lambda: |-
          {
            // Force any pending preference writes (HA-changed numbers/switches with
            // restore_value/restore_mode) to flash now. ESPHome's preferences component
            // batches writes on a periodic background flush — on this device the awake
            // window is only ~30-90s before SYS_CMD_OFF cuts ALL power, which is not
            // guaranteed to be long enough for that periodic flush to have run yet.
            // Confirmed Jun 2026: settings changed via HA, then lost, when a PMIC shutdown
            // fired ~32s later with no preferences flush log observed in between.
            global_preferences->sync();
            ESP_LOGI("PMIC", "Preferences flushed to flash before shutdown");

            auto *bus = id(i2c_bus);
            const uint8_t addr = 0x6E;

            // Write POWERON_TIMER: 32-bit LE seconds to regs 0x38–0x3B
            // (bits 31-30 of 0x3B must be 0 per PFalko implementation — mask with 0x7F)
            uint32_t ws = wake_seconds;
            uint8_t timer[5] = {0x38,
                (uint8_t)( ws        & 0xFF),
                (uint8_t)((ws >>  8) & 0xFF),
                (uint8_t)((ws >> 16) & 0xFF),
                (uint8_t)((ws >> 24) & 0x7F)};
            bus->write(addr, timer, 5);

            // Arm timer: write 0x0B to TIM_CFG (reg 0x3C)
            uint8_t arm[2] = {0x3C, 0x0B};
            bus->write(addr, arm, 2);

            // Commit timer: write 0xA5 to TIM_KEY (reg 0x3D) before readback
            // (PFalko sequence: arm → commit → verify. Writing 0x3D first may be required
            // for 0x3C to reflect the armed state on readback.)
            uint8_t commit[2] = {0x3D, 0xA5};
            bus->write(addr, commit, 2);

            // Fail-safe readback: if reg 0x3C != 0x0B, abort shutdown
            uint8_t r = 0x3C, verify = 0;
            bus->write(addr, &r, 1, false);
            bus->read(addr, &verify, 1);
            if (verify != 0x0B) {
              ESP_LOGE("PMIC", "Timer arm FAILED (0x3C = 0x%02X, want 0x0B) — staying awake", verify);
              return;  // abort — device stays awake
            }

            ESP_LOGI("PMIC", "Wake timer armed for %u seconds — issuing SYS_CMD_OFF", (unsigned int)wake_seconds);
            delay(120);

            // Full PMIC shutdown — reg 0x0C = 0xA1 (SYS_CMD_OFF)
            // ESP32 loses power immediately. Device reboots after wake_seconds.
            uint8_t off[2] = {0x0C, 0xA1};
            bus->write(addr, off, 2);

            // Should not reach here
            delay(500);
            ESP_LOGE("PMIC", "SYS_CMD_OFF did not take effect — device still running");
          }

  # ── 90-second battery watchdog ──────────────────────────────────────────────
  # Fires if the device is still awake on battery 90 seconds after boot.
  # Replaces the safety guarantee previously provided by deep_sleep run_duration: 60s.
  # If the normal -200 shutdown path completes, the device is already off and this
  # script never triggers. If it hangs (WiFi timeout, stuck wait_until, etc.) this
  # fires pmic_shutdown with a 15-minute retry timer so the battery isn't drained.
  - id: battery_watchdog
    mode: single
    then:
      - delay: 180s
      - if:
          condition:
            lambda: 'return !id(usb_connected).state;'
          then:
            - lambda: 'ESP_LOGW("watchdog", "Battery wake >90s without shutdown — safety net firing");'
            - script.execute:
                id: pmic_shutdown
                wake_seconds: 900  # 15 min retry

  # ── Weather forecast fetch ──────────────────────────────────────────────────
  # Forecasts are not entity attributes in modern HA, so call weather.get_forecasts.
  # response_template trims the (large) hourly list on the HA side to six "label,condition,temp"
  # entries: the first six slots strictly after now from the grid 00/09/12/15/18/21, with the
  # last item always on the next day — if only one next-day slot fits it is 09, otherwise the
  # next-day slots start at 00. A slot on a new day gets a weekday label.
  # Needs ESPHome/HA >= 2025.10 and "Allow the device to perform Home Assistant actions".
  - id: fetch_weather
    mode: single
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: !secret ha_weather_entity
            type: hourly
          capture_response: true
          response_template: |-
            {%- set t = now() -%}
            {%- set grid = [0, 9, 12, 15, 18, 21] -%}
            {%- set n_today = (t.hour < 9) + (t.hour < 12) + (t.hour < 15) + (t.hour < 18) + (t.hour < 21) -%}
            {%- set tomorrow = (t + timedelta(days=1)).date() -%}
            {%- set ns = namespace(items=[], prev=t.date(), n=0) -%}
            {%- set fc = response.values() | first -%}
            {%- for x in fc['forecast'] -%}
              {%- set d = as_local(as_datetime(x.datetime)) -%}
              {%- set ok = d > t and d.hour in grid and (d.date() == t.date()
              or (d.date() == tomorrow and (n_today < 5 or d.hour == 9))) -%}
              {%- if ns.n < 6 and ok -%}
                {%- set lbl = d.strftime('%a %H') if d.date() != ns.prev else d.strftime('%H') -%}
                {%- set ns.items = ns.items + [lbl ~ ',' ~ x.condition ~ ',' ~ x.temperature] -%}
                {%- set ns.prev = d.date() -%}
                {%- set ns.n = ns.n + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.items | join(';') }}
          on_success:
            - lambda: |-
                const char *s = response["response"].as<const char *>();
                id(wx_hourly) = s ? s : "";
          on_error:
            - logger.log: "Hourly forecast request failed"
      - wait_until:
          condition:
            lambda: |-
              return !id(wx_hourly).empty();
          timeout: 15s

  - id: ota_led_flash
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - light.turn_on:
                id: leds
                red: 0%
                green: 100%
                blue: 0%
                brightness: 30%
            - delay: 500ms
            - light.turn_off: leds
            - delay: 500ms

  - id: voice_processing_led
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - light.turn_on:
                id: leds
                red: 100%
                green: 100%
                blue: 0%
                brightness: 30%
            - delay: 500ms
            - light.turn_off: leds
            - delay: 500ms

  # ── Restore the powered-on indicator LED (or turn it off if disabled) ──────
  # Color: white normally, red when the low-battery warning is active.
  # Waits for any in-flight voice assistant session to finish first, so a
  # low-battery shutdown mid-answer doesn't cut the LED (and the caller's
  # subsequent delays) while TTS is still playing.
  - id: restore_indicator_led
    mode: single
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 60s
      - if:
          condition:
            lambda: 'return id(indicator_led_switch).state;'
          then:
            - if:
                condition:
                  lambda: 'return id(low_battery_triggered);'
                then:
                  - light.turn_on:
                      id: leds
                      red: 100%
                      green: 0%
                      blue: 0%
                      brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
                else:
                  - light.turn_on:
                      id: leds
                      red: 100%
                      green: 100%
                      blue: 100%
                      brightness: !lambda 'return id(indicator_brightness).state / 100.0f;'
          else:
            - light.turn_off: leds


# ── Configurable intervals ────────────────────────────────────────────────────
number:
  - platform: template
    name: "On USB Refresh Interval"
    id: usb_refresh_mins
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:refresh"
    entity_category: config

  # Brightness of the powered-on indicator LED (see "Powered Indicator LED" switch)
  - platform: template
    name: "Indicator LED Brightness"
    id: indicator_brightness
    min_value: 1
    max_value: 100
    step: 1
    # 20 seems to be smallest value to light up the led
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:brightness-5"
    entity_category: config
    on_value:
      # Re-apply immediately if the indicator is currently on
      - if:
          condition:
            lambda: 'return id(indicator_led_switch).state;'
          then:
            - lambda: |-
                auto call = id(leds).turn_on();
                call.set_rgb(1.0f, 1.0f, 1.0f);
                call.set_brightness(id(indicator_brightness).state / 100.0f);
                call.perform();

