esphome:
  name: esphome-web-c18450
  friendly_name: M5Stack PaperColor
  min_version: 2026.4.0
  name_add_mac_suffix: false

  on_boot:
    # ── M5PM1 PMIC boot sequence (priority 800) ───────────────────────────────
    # The M5PM1 is a custom power management IC that controls the EPD power rail.
    # By default at power-on, the EPD rail is OFF — the display will not respond
    # to any SPI commands until the rail is enabled.
    #
    # This lambda runs at priority 800 (early boot), which is AFTER the I2C bus
    # is initialized (priority 900) but BEFORE the epaper_spi display component
    # sets up (priority 500). This ordering is critical — if the display tries to
    # initialize before the EPD rail is on, it will hang waiting for the BUSY pin.
    #
    # The register sequence below is derived from the M5Stack factory firmware HAL:
    #   https://github.com/m5stack/M5PaperColor-UserDemo/blob/main/main/hal/hal.cpp
    # and the M5GFX library source. It is equivalent to calling:
    #   pm1.pinMode(EPD_EN, OUTPUT);    // EPD_EN = M5PM1 GPIO0
    #   pm1.digitalWrite(EPD_EN, HIGH); // enable EPD power rail
    #   pm1.setChargeEnable(true);      // PWR_CFG reg 0x06 bit 0
    #   pm1.setBoostEnable(true);       // PWR_CFG reg 0x06 bit 3 — generates
    #                                   // high-voltage rails (~15V) needed for
    #                                   // e-paper pixel switching
    #
    # We use ESPHome's native I2C bus API (id(i2c_bus)) rather than Arduino Wire
    # because the combined arduino/espidf framework does not expose Wire in the
    # ESPHome lambda scope.
    #
    # M5PM1 I2C address: 0x6E. Chip ID register 0x00 must return 0x50.
    - priority: 800.0
      then:
        - lambda: |-
            delay(200);
            auto *bus = id(i2c_bus);
            const uint8_t addr = 0x6E;

            ESP_LOGI("M5PM1", "Starting M5PM1 init...");

            uint8_t reg = 0x00, chip_id = 0;
            auto write_err = bus->write(addr, &reg, 1, false);
            auto read_err = bus->read(addr, &chip_id, 1);

            ESP_LOGI("M5PM1", "Write err: %d, Read err: %d, Chip ID: 0x%02X", (int)write_err, (int)read_err, chip_id);

            if (chip_id != 0x50) {
              ESP_LOGE("M5PM1", "Unexpected chip ID: 0x%02X (expected 0x50)", chip_id);
              return;
            }

            { uint8_t d[2] = {0x0A, 0x00}; bus->write(addr, d, 2); }

            // GPIO function select — set GPIO0 and GPIO3 to plain GPIO mode (reg 0x16)
            { uint8_t r = 0x16, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v & ~((1<<0) | (1<<3)))}; bus->write(addr, d, 2); }

            // GPIO direction — set GPIO0 (EPD) and GPIO3 (SD) as outputs (reg 0x10)
            { uint8_t r = 0x10, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v | (1<<0) | (1<<3))}; bus->write(addr, d, 2); }

            // GPIO push-pull mode — disable open-drain on GPIO0 and GPIO3 (reg 0x13)
            { uint8_t r = 0x13, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v & ~((1<<0) | (1<<3)))}; bus->write(addr, d, 2); }

            // GPIO output HIGH — enable EPD (GPIO0) and SD (GPIO3) power rails (reg 0x11)
            { uint8_t r = 0x11, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v | (1<<0) | (1<<3))}; bus->write(addr, d, 2); }

            // PWR_CFG (0x06): enable charging (bit0), 5V DCDC (bit1), 3.3V LDO (bit2),
            // boost converter (bit3) — auto-clear on reset so must be set every boot
            { uint8_t r = 0x06, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v | (1<<0) | (1<<1) | (1<<2) | (1<<3))}; bus->write(addr, d, 2); }
            ESP_LOGI("M5PM1", "Charge + DCDC + LDO + Boost enabled");

            // HOLD_CFG (0x07): maintain EPD (bit0), SD (bit3), and 3.3V (bit5) rails
            // on USB disconnect — without this the PMIC may reset when USB is unplugged
            { uint8_t r = 0x07, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {r, uint8_t(v | (1<<0) | (1<<3) | (1<<5))}; bus->write(addr, d, 2); }
            ESP_LOGI("M5PM1", "Power hold configured");

            // Disable PMIC I2C idle-sleep — keeps PMIC responsive during shutdown sequence
            { uint8_t d[2] = {0x09, 0x00}; bus->write(addr, d, 2); }

            // Button config — set SINGLE_RST_DIS (0x49 bit0) and DOUBLE_OFF_DIS (0x4A bit0)
            // to prevent PMIC hardware single-press reset / double-press power-off while running.
            // Read-modify-write to preserve other bits (PFalko pattern).
            { uint8_t r = 0x49, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {0x49, uint8_t(v | 0x01)}; bus->write(addr, d, 2); }
            { uint8_t r = 0x4A, v = 0; bus->write(addr, &r, 1, false); bus->read(addr, &v, 1);
              uint8_t d[2] = {0x4A, uint8_t(v | 0x01)}; bus->write(addr, d, 2); }

            delay(500);
            ESP_LOGI("M5PM1", "EPD power rail enabled");
    - priority: 750.0
      then:
        - lambda: |-
            pinMode(45, OUTPUT);
            digitalWrite(45, HIGH);  // Audio codec/microphone power
            pinMode(46, OUTPUT);
            digitalWrite(46, HIGH);  // Speaker amplifier enable
        - delay: 50ms
    - priority: -100
      then:
        - lambda: |-
            // Brief blue boot-confirmation flash on every boot.
            // With PMIC full shutdown, all boots are cold power-on — GPIO9/Button B
            // can no longer wake the device (ESP32 is powerless during shutdown).
            // On-demand wake uses physical power button S4 (PMIC-side), which looks
            // identical to a timer wake at the ESP32 level.
            auto call = id(leds).turn_on();
            call.set_rgb(0.0f, 0.0f, 1.0f);
            call.set_brightness(0.3f);
            call.perform();
        - delay: 1s
        # Powered-on indicator: dim white, stays on until pmic_shutdown turns it off.
        # Only when the "Powered Indicator LED" switch is on (restored from HA).
        - if:
            condition:
              lambda: 'return id(indicator_led_switch).state;'
            then:
              - lambda: |-
                  auto call = id(leds).turn_on();
                  call.set_rgb(1.0f, 1.0f, 1.0f);
                  call.set_brightness(id(indicator_brightness).state / 100.0f);
                  call.perform();
        - script.execute: battery_watchdog
    - priority: -200
      then:
        - delay: 25s     # display hardware init takes ~19s; wait for it to complete
        - lambda: 'id(waiting_for_sensors) = true;'
        - wait_until:
            condition:
              and:
                - lambda: 'return id(ha_outdoor_temp).has_state();'
                - lambda: 'return !isnan(id(local_temp).state);'
            timeout: 60s  # give up and refresh with whatever we have after 60s
        - script.wait: fetch_weather   # no-op if the API never connected; bounded by the script's own timeout
        - lambda: 'id(waiting_for_sensors) = false;'
        - component.update: reset_reason
        - component.update: build_date_sensor
        - component.update: battery_mv
        - if:
            condition:
              # Low battery path: triggers if voltage is valid and below threshold,
              # or if the "Simulate Low Battery" switch is on.
              # USB guard: never trigger on USB — PMIC shutdown while charging is incorrect.
              # NaN (no reading) evaluates false — safe fallback to normal path.
              lambda: |-
                if (id(usb_connected).state) return false;
                return (id(battery_mv).has_state() && id(battery_mv).state < 3350.0f)
                       || id(simulate_low_battery).state;
            then:
              # ── Low battery boot path ────────────────────────────────────────────
              # Render warning screen then issue PMIC shutdown with 7-day timer.
              # SYS_CMD_OFF cuts all rails — no need to disable them individually first.
              - lambda: |-
                  id(low_battery_triggered) = true;
                  id(initial_display_done) = true;  // prevent on_value from queuing a second refresh during our 20s EPD wait
                  id(epd_refresh_in_progress) = true;
                  ESP_LOGW("battery", "Low battery (%.0f mV) — showing warning screen", id(battery_mv).state);
              - component.update: m5_color_screen
              - script.stop: ota_led_flash
              #- light.turn_off: leds
              - script.execute: restore_indicator_led
              # Wait for EPD panel refresh to complete before PMIC cuts power (~15-19s refresh)
              - delay: 30s
              - lambda: 'id(epd_refresh_in_progress) = false;'
              # PMIC shutdown with 7-day timer — effectively indefinite.
              # User can wake manually via physical power button S4 to charge.
              - lambda: 'ESP_LOGI("sleep", "PMIC shutdown (low battery) — 7-day timer");'
              - script.execute:
                  id: pmic_shutdown
                  wake_seconds: 604800
            else:
              # ── Normal boot path ─────────────────────────────────────────────────
              - component.update: wifi_signal_db
              - if:
                  condition:
                    lambda: 'return id(ha_outdoor_temp).has_state();'
                  then:
                    - lambda: 'id(initial_display_done) = true;'
                    - logger.log: "Sensors ready — marking initial display done before refresh"
              - lambda: |-
                  // Cancel OTA rollback explicitly — PMIC shutdown fires at ~37s, before
                  // safe_mode's 60s "Successful after" timer, so without this every OTA
                  // would roll back on the first battery wake.
                  esp_ota_mark_app_valid_cancel_rollback();
                  ESP_LOGI("OTA", "Boot marked valid — OTA rollback cancelled");
              - lambda: |-
                  // Unconditional diagnostic — always logs what the device currently has
                  // stored/read for the overnight feature, regardless of whether the quiet
                  // path triggers. Without this, a "false" outcome is silent and there is no
                  // way to tell from logs alone whether settings failed to persist, the window
                  // math is wrong, or a wake simply landed outside the window as expected.
                  auto t = id(ha_time).now();
                  ESP_LOGD("sleep", "Overnight check: enabled=%s start=%d end=%d hour=%d (valid=%s) usb=%s",
                           id(overnight_mode).state ? "true" : "false",
                           (int)id(overnight_start_hour).state,
                           (int)id(overnight_end_hour).state,
                           t.hour, t.is_valid() ? "true" : "false",
                           id(usb_connected).state ? "true" : "false");
              - if:
                  condition:
                    # ── Overnight quiet window check ──────────────────────────────────
                    # On battery, when enabled, computes whether we're inside the
                    # configured quiet window and — if so — how many seconds remain
                    # until it ends. Sets overnight_wake_seconds and returns true only
                    # when the quiet path should be taken (skip display + sleep until
                    # window end). See project memory for the edge-case rationale
                    # (midnight-spanning window, strict boundary, max cap, min floor,
                    # start==end disables the feature).
                    lambda: |-
                      if (id(usb_connected).state) return false;
                      if (!id(overnight_mode).state) return false;
                      auto t = id(ha_time).now();
                      if (!t.is_valid()) return false;
                      int sh = (int)id(overnight_start_hour).state;
                      int eh = (int)id(overnight_end_hour).state;
                      if (sh == eh) return false;  // zero-width window = disabled
                      int ch = t.hour;
                      bool in_window = (sh < eh) ? (ch >= sh && ch < eh) : (ch >= sh || ch < eh);
                      if (!in_window) return false;

                      uint32_t normal_s = (uint32_t)(id(battery_sleep_mins).state * 60.0f);
                      int hours_until = ((eh - ch) % 24 + 24) % 24;          // always 1..23 here
                      uint32_t secs_until_end = (uint32_t)hours_until * 3600 - t.minute * 60 - t.second;
                      int window_hours = ((eh - sh) % 24 + 24) % 24;        // always 1..23 here
                      uint32_t cap = (uint32_t)window_hours * 3600;
                      if (secs_until_end > cap) secs_until_end = cap;        // defensive clamp

                      if (secs_until_end < normal_s) {
                        ESP_LOGI("sleep", "Overnight window active but only %us remain — using normal interval", (unsigned int)secs_until_end);
                        return false;  // min-floor guard: not worth a special short cycle
                      }

                      id(overnight_wake_seconds) = secs_until_end;
                      ESP_LOGI("sleep", "OVERNIGHT SLEEP: hour=%d window=%d-%d wake_in=%us (cap=%us)", ch, sh, eh, (unsigned int)secs_until_end, (unsigned int)cap);
                      return true;
                  then:
                    # ── Overnight quiet path: skip display refresh entirely ──────────
                    - script.stop: ota_led_flash
                    - light.turn_off: leds
                    - script.execute:
                        id: pmic_shutdown
                        wake_seconds: !lambda 'return id(overnight_wake_seconds);'
                  else:
                    - lambda: 'id(epd_refresh_in_progress) = true;'
                    - component.update: m5_color_screen
                    - script.stop: ota_led_flash
                    #- light.turn_off: leds
                    - script.execute: restore_indicator_led
                    # 20s covers: 150ms WS2812 off-frame settle + up to ~19s Spectra E6 full refresh.
                    # The EPD component.update is asynchronous — the panel refresh runs in the background
                    # and takes 15–19s. We must not cut the EPD power rail until it is complete.
                    # Using 30s in an attempt to resolve occasional partial refresh
                    - delay: 30s
                    - lambda: 'id(epd_refresh_in_progress) = false;'
                    - lambda: 'id(last_usb_refresh_ms) = millis();'
                    - if:
                        condition:
                          lambda: 'return id(usb_connected).state;'
                        then:
                          # USB connected — stay awake. Interval refresh handles periodic updates.
                          # Rails must remain on for display updates without rebooting.
                          - logger.log: "USB connected — staying awake (no PMIC shutdown)"
                        else:
                          # ── Battery mode: PMIC full shutdown ────────────────────────────
                          # SYS_CMD_OFF cuts all rails — no need to disable them individually.
                          # Disabling rails before shutdown would leave them off if the fail-safe
                          # aborts shutdown, degrading the device without powering it down.
                          - lambda: 'ESP_LOGI("sleep", "PMIC shutdown — wake in %.0f min", id(battery_sleep_mins).state);'
                          - script.execute:
                              id: pmic_shutdown
                              wake_seconds: !lambda 'return (uint32_t)(id(battery_sleep_mins).state * 60.0f);'

# ── Globals ───────────────────────────────────────────────────────────────────

globals:
  - id: initial_display_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_usb_refresh_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: low_battery_triggered
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: overnight_wake_seconds
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: waiting_for_sensors
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: epd_refresh_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  # Forecast string filled by fetch_weather: five "label,condition,temp" entries joined by ";"
  - id: wx_hourly
    type: std::string
    restore_value: false
    initial_value: '""'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  toolchain: esp-idf
  framework:
    type: arduino
    advanced:
      flash_chip: generic
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

logger:
#  hardware_uart: USB_SERIAL_JTAG
  #level: DEBUG

api:
  on_client_connected:
    - delay: 3s   # HA drops actions sent right at connect
    - script.execute: fetch_weather
  encryption:
    key: !secret papercolor_encryption_key

safe_mode:

ota:
  - platform: esphome
    encryption:

voice_assistant:
  id: papercolor_voice
  microphone: papercolor_mic
  speaker: papercolor_speaker
  use_wake_word: false
  #noise_suppression_level: 2
  #auto_gain: 31dBFS
  volume_multiplier: 0.5

  on_start:
    - logger.log: "VA: Started"

  # Microphone is active
  on_listening:
    - logger.log: "VA: Listening for audio"
    - light.turn_on:
        id: leds
        red: 100%
        green: 0%
        blue: 0%
        brightness: 30%
  
  on_stt_vad_start:
    - logger.log: "VA: VAD start"
    - script.execute: voice_processing_led

  on_stt_end:
     - logger.log:
        format: "Recognized speech: %s"
        args: ["x.c_str()"]

  on_tts_start:
    - logger.log: "VA: Response audio starting"
    - audio_dac.set_volume: !lambda |-
        return id(tts_audio_dac_volume).state / 100.0f;
    - speaker.volume_set: !lambda |-
        return id(tts_speaker_volume).state / 100.0f;

  # Session ends sometime before TTS playback..
  on_end:
    - logger.log: "VA: Session ended"
    #- script.stop: voice_processing_led
    #- script.execute: restore_indicator_led

  on_tts_stream_start:
    - logger.log: "VA: TTS stream start"
    - script.stop: voice_processing_led
    - light.turn_on:
        id: leds
        red: 100%
        green: 100%
        blue: 0%
        brightness: 30%

  on_tts_stream_end:
    - logger.log: "VA: TTS stream end"
    - script.stop: voice_processing_led
    - script.execute: restore_indicator_led

  # Doesn't seem to trigger ever
  on_idle:
    - logger.log: "VA: Session idle"

  # Restore normal indicator if the request fails 
  # TODO copy paste slop indicator led (also needed after ota flash)
  on_error:
    - logger.log: "VA: ERROR occurred"
    - script.stop: voice_processing_led
    - script.execute: restore_indicator_led

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true   # skip AP scan on cold-boot wake — saves 1-3s per cycle
  reboot_timeout: 0s   # disable WiFi-triggered esp_restart(); battery_watchdog handles WiFi failures cleanly via PMIC shutdown
  # use_address: 192.168.3.x  # Uncomment and set to your device's reserved/static IP
                               # Improves OTA reliability by bypassing mDNS resolution
  ap:
    ssid: "PaperColor Fallback"
    password: !secret papercolor_ap_password
    
captive_portal:

# ── Time ──────────────────────────────────────────────────────────────────────

time:
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Helsinki"

# ── I2C ───────────────────────────────────────────────────────────────────────
# SDA=GPIO3, SCL=GPIO2 confirmed from M5GFX source and factory firmware hal.h
# GPIO3 is a strapping pin — warning is expected and safe to ignore on this hardware

i2c:
  sda: GPIO3
  scl: GPIO2
  frequency: 100000
  id: i2c_bus
  scan: false


# -- Audio --
i2s_audio:
  - id: papercolor_i2s
    i2s_lrclk_pin: GPIO41
    i2s_bclk_pin: GPIO40
    i2s_mclk_pin: GPIO42

audio_adc:
  - platform: es7210
    id: papercolor_adc
    i2c_id: i2c_bus
    address: 0x40
    sample_rate: 16000
    bits_per_sample: 16bit
    #mic_gain: 24dB

audio_dac:
  - platform: es8311
    id: papercolor_dac
    i2c_id: i2c_bus
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true

microphone:
  - platform: i2s_audio
    id: papercolor_mic
    i2s_audio_id: papercolor_i2s
    i2s_din_pin: GPIO39
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: papercolor_speaker
    i2s_audio_id: papercolor_i2s
    i2s_dout_pin: GPIO38
    dac_type: external
    audio_dac: papercolor_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 100ms

# ── SPI (e-paper display) ─────────────────────────────────────────────────────

spi:
  clk_pin: GPIO15
  mosi_pin: GPIO13

# ── Colors ────────────────────────────────────────────────────────────────────

color:
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  - id: color_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  # color_yellow: used as the dither pair with color_red to simulate orange header
  # to simulate orange in the header (1px checkerboard). Spectra-E6 has no native orange.
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%

# ── Fonts ─────────────────────────────────────────────────────────────────────

font:
  - file: "gfonts://Ubuntu"
    id: font_large
    size: 32
  - file: "gfonts://Ubuntu"
    id: font_main
    size: 24
  - file: "gfonts://Ubuntu"
    id: font_small
    size: 18
  - file: "gfonts://Ubuntu"
    id: font_outdoor
    size: 24
  - file: "gfonts://Ubuntu"
    id: font_tiny
    size: 14

  # MDI weather icons — glyph names mirror Home Assistant weather conditions
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: weather_icon_font
    size: 22
    glyphs:
      - "\U000F0599"  # sunny
      - "\U000F0594"  # clear-night
      - "\U000F0595"  # partlycloudy
      - "\U000F0590"  # cloudy
      - "\U000F0597"  # rainy
      - "\U000F0596"  # pouring
      - "\U000F0598"  # snowy
      - "\U000F067F"  # snowy-rainy
      - "\U000F0591"  # fog
      - "\U000F0592"  # hail
      - "\U000F0593"  # lightning
      - "\U000F067E"  # lightning-rainy
      - "\U000F059D"  # windy
      - "\U000F059E"  # windy-variant
      - "\U000F0F2F"  # exceptional (cloudy-alert)

  # MDI icon font — battery icons for header display
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_font
    size: 26
    glyphs:
      - "\U000F0079"  # battery (100%)
      - "\U000F0082"  # battery-90
      - "\U000F0081"  # battery-80
      - "\U000F0080"  # battery-70
      - "\U000F007F"  # battery-60
      - "\U000F007E"  # battery-50
      - "\U000F007D"  # battery-40
      - "\U000F007C"  # battery-30
      - "\U000F007B"  # battery-20
      - "\U000F007A"  # battery-10
      - "\U000F008E"  # battery-outline (0%)
      - "\U000F0085"  # battery-charging-100
      - "\U000F008B"  # battery-charging-90
      - "\U000F008A"  # battery-charging-80
      - "\U000F089E"  # battery-charging-70
      - "\U000F0089"  # battery-charging-60
      - "\U000F089D"  # battery-charging-50
      - "\U000F0088"  # battery-charging-40
      - "\U000F0087"  # battery-charging-30
      - "\U000F0086"  # battery-charging-20
      - "\U000F089C"  # battery-charging-10
      - "\U000F02DC"  # Home icon (Room)
      - "\U000F050F"  # thermometer (Outdoors sensor)
  # Tabler icon font — wifi icons for footer display
  - file: "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/fonts/tabler-icons.ttf"
    id: tabler_font
