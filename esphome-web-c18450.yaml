# ── Switches ──────────────────────────────────────────────────────────────────
switch:
  # Simulate Low Battery — forces the low battery warning screen on next battery wake cycle.
  # Resets to OFF on every boot (restore_mode: ALWAYS_OFF) so it is safe to leave enabled;
  # it cannot get stuck on and cause a boot loop. Useful for testing layout changes.
  - platform: template
    name: "Simulate Low Battery"
    id: simulate_low_battery
    icon: "mdi:battery-alert"
    restore_mode: ALWAYS_OFF
    optimistic: true
    entity_category: config
    turn_on_action:
      - lambda: |-
          id(low_battery_triggered) = true;
      - component.update: m5_color_screen
    turn_off_action:
      - lambda: |-
          id(low_battery_triggered) = false;
      - component.update: m5_color_screen

  # Overnight quiet window — when enabled and on battery, skips the display
  # refresh entirely during Overnight Begin Hour..Overnight End Hour and
  # sleeps directly until the window ends, instead of waking every
  # On Battery Sleep Duration interval. Off by default.
  - platform: template
    name: "Overnight Quiet Mode"
    id: overnight_mode
    icon: "mdi:weather-night"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config

  - platform: template
    name: "Show Legend"
    id: show_legend_switch
    icon: "mdi:format-list-bulleted-type"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config

  - platform: template
    name: "Threshold Dynamic"
    id: dynamic_threshold_switch
    icon: "mdi:percent"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config

  # Powered-on indicator — dim white LED while the device is awake.
  # Restored on boot; the on_boot sequence only lights the LED when this is ON.
  # The LED is always cleared by pmic_shutdown before the power rail dies.
  - platform: template
    name: "Powered Indicator LED"
    id: indicator_led_switch
    icon: "mdi:led-strip-variant"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    turn_on_action:
      - lambda: |-
          auto call = id(leds).turn_on();
          call.set_rgb(1.0f, 1.0f, 1.0f);
          call.set_brightness(id(indicator_brightness).state / 100.0f);
          call.perform();
    turn_off_action:
      - light.turn_off: leds



# ── Buttons ───────────────────────────────────────────────────────────────────
# Physical order left to right: A=GPIO10, B=GPIO9, C=GPIO1
# Button A: manual display refresh (useful for a second refresh within the wake window)
# Button B: wake pin — wakes device from deep sleep, triggers auto refresh + 90s OTA window
# Button C: available for future use

binary_sensor:
  - platform: template
    name: "USB Connected"
    id: usb_connected
    device_class: plug
    entity_category: diagnostic
    lambda: |-
      // Read VIN from M5PM1 register 0x24 (16-bit little-endian, value in mV)
      // VIN > 4000mV indicates USB power is present
      auto *bus = id(i2c_bus);
      const uint8_t addr = 0x6E;
      uint8_t reg = 0x24;
      uint8_t data[2] = {0, 0};
      bus->write(addr, &reg, 1, false);
      bus->read(addr, data, 2);
      uint16_t vin = data[0] | (data[1] << 8);
      return vin > 4000;
    filters:
      - delayed_on_off: 500ms   # debounce transient reads on connect/disconnect
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              # ── USB connected ───────────────────────────────────────────────
              # ESPHome binary sensor deduplicates state — on_state only fires on
              # genuine transitions, so no manual guard is needed.
              - lambda: 'ESP_LOGI("USB", "USB connected — PMIC shutdown suspended");'
              - script.stop: ota_led_flash
              - light.turn_off: leds
              - if:
                  condition:
                    lambda: 'return id(initial_display_done) && !id(epd_refresh_in_progress);'
                  then:
                    - component.update: battery_mv
                    - component.update: wifi_signal_db
                    - component.update: m5_color_screen
            else:
              # ── USB disconnected → refresh display, then PMIC shutdown ───────
              # Guard: only act after boot is complete. The -200 boot sequence
              # handles shutdown for devices that boot without USB; we must not race it.
              - if:
                  condition:
                    lambda: 'return id(initial_display_done);'
                  then:
                    - lambda: 'ESP_LOGI("USB", "USB disconnected — refreshing then issuing PMIC shutdown");'
                    - component.update: battery_mv
                    - component.update: wifi_signal_db
                    - lambda: 'id(epd_refresh_in_progress) = true;'
                    - component.update: m5_color_screen
                    - delay: 30s   # wait for EPD panel refresh to complete (~15-19s)
                    - lambda: 'id(epd_refresh_in_progress) = false;'
                    - script.execute:
                        id: pmic_shutdown
                        wake_seconds: !lambda 'return (uint32_t)(id(battery_sleep_mins).state * 60.0f);'

  - platform: gpio
    pin:
      number: GPIO10
      inverted: true
      mode: INPUT_PULLUP
    name: "Button A"
    id: btn_a
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(epd_refresh_in_progress);'
            then:
              - logger.log: "Button A pressed — refreshing display"
              - component.update: battery_mv
              - component.update: wifi_signal_db
              - component.update: m5_color_screen


  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
      mode: INPUT_PULLUP
    name: "Button C"
    id: btn_c
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - logger.log: "Button C pressed — starting voice assistant"
        - voice_assistant.start:
            silence_detection: true

    on_release:
      then:
        - logger.log: "Button C released"
        #- voice_assistant.stop:
        #- script.execute: voice_processing_led

# ── RGB LEDs ──────────────────────────────────────────────────────────────────

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO21
    num_leds: 2
    chipset: WS2812
    name: "LEDs"
    id: leds
    internal: true
    default_transition_length: 0s

# ── IR Transmitter ────────────────────────────────────────────────────────────
# Disabled: conflicts with LED strip for RMT channels. Re-enable if IR needed
# and LED strip is removed or a different LED driver is used.
# remote_transmitter:
#   pin: GPIO48
#   carrier_duty_percent: 50%
#   non_blocking: true

# ── E-Paper Display ───────────────────────────────────────────────────────────
# Panel: EL040EF1 / ED2208-DOA — E Ink Spectra 6 (7-color), 400×600, 4"
# Rotation 270° = landscape. Dimensions reported as 600×400 by driver.
# BUSY pin must be inverted: true — confirmed from Seeed reTerminal reference
# design (also Spectra-E6) and required for this panel's BUSY polarity.

display:
  - platform: epaper_spi
    id: m5_color_screen
    model: Spectra-E6
    cs_pin: GPIO44
    dc_pin: GPIO43
    busy_pin:
      number: GPIO11
      inverted: true
      mode:
        input: true
        pullup: true
    reset_pin: GPIO12
    dimensions:
      width: 400
      height: 600
    rotation: 270°
    update_interval: never
    lambda: |-
      it.fill(id(color_white));

      // ── Low battery screen ────────────────────────────────────────────────
      if (id(low_battery_triggered)) {
        it.filled_rectangle(0, 0, 600, 56, id(color_red));
        it.print(300, 12, id(font_large), id(color_white), TextAlign::TOP_CENTER, "BATTERY LOW");
        it.print(300, 100, id(font_large), id(color_red), TextAlign::TOP_CENTER, "Please charge via USB-C");
        it.print(300, 180, id(icon_font), id(color_red), TextAlign::TOP_CENTER, "\U000F008E");
        if (id(battery_pct).has_state()) {
          it.printf(300, 215, id(font_small), id(color_black), TextAlign::TOP_CENTER, "%.0f%% remaining", id(battery_pct).state);
        }
        it.horizontal_line(60, 270, 480, id(color_black));
        it.print(300, 290, id(font_main), id(color_black), TextAlign::TOP_CENTER, "Device has powered off to preserve battery.");
        it.print(300, 325, id(font_small), id(color_black), TextAlign::TOP_CENTER, "Charge via USB-C, then press the power button to wake.");
        return;
      }

      auto time_now = id(ha_time).now();
      int current_hour = time_now.is_valid() ? time_now.hour : 0;

      // Parse data first to find actual max for header color-coding if needed
      // (We compute dataset values early so header can react to high prices)
      auto parse_csv = [](const std::string &csv) {
        std::vector<float> vec;
        size_t start = 0, end = 0;
        while ((end = csv.find(',', start)) != std::string::npos) {
          vec.push_back(strtof(csv.substr(start, end - start).c_str(), nullptr));
          start = end + 1;
        }
        if (start < csv.length()) {
          vec.push_back(strtof(csv.substr(start).c_str(), nullptr));
        }
        return vec;
      };

      auto to_hourly = [](const std::vector<float> &raw) {
        std::vector<float> hourly;
        if (raw.size() >= 96) {
          for (int h = 0; h < 24; h++) {
            float sum = 0;
            for (int q = 0; q < 4; q++) {
              sum += raw[h * 4 + q];
            }
            hourly.push_back(sum / 4.0f);
          }
        } else {
          hourly = raw;
        }
        return hourly;
      };

      std::vector<float> prices_today = to_hourly(parse_csv(id(nordpool_prices_csv).state));
      std::vector<float> prices_tomorrow = to_hourly(parse_csv(id(nordpool_tomorrow_csv).state));

      bool has_tomorrow = (prices_tomorrow.size() >= 24);
      std::vector<float> chart_prices = prices_today;
      if (has_tomorrow) {
        chart_prices.insert(chart_prices.end(), prices_tomorrow.begin(), prices_tomorrow.end());
      }
      int total_bars = chart_prices.size();

      // Find actual max early for extended range check
      float actual_max = 0.0f;
      for (float p : chart_prices) {
        if (p > actual_max) actual_max = p;
      }
      float max_scale = id(max_scale_config).has_state() ? id(max_scale_config).state : 30.0f;
      bool is_extended = false;
      if (actual_max > max_scale) {
        max_scale = std::ceil(actual_max / 5.0f) * 5.0f;
        is_extended = true;
      }

      float actual_max_today = 0.0f;
      float actual_min_today = 0.0f;
      float actual_sum_today = 0.0f;

      if (!prices_today.empty()) {
        actual_max_today = prices_today[0];
        actual_min_today = prices_today[0];

        for (float p : prices_today) {
          if (p > actual_max_today) actual_max_today = p;
          if (p < actual_min_today) actual_min_today = p;
          actual_sum_today += p;
        }
      }

      float actual_avg_today = prices_today.empty()
          ? 0.0f
          : (actual_sum_today / prices_today.size());


      float actual_max_tomorrow = 0.0f;
      float actual_min_tomorrow = 0.0f;
      float actual_sum_tomorrow = 0.0f;

      if (!prices_tomorrow.empty()) {
        actual_max_tomorrow = prices_tomorrow[0];
        actual_min_tomorrow = prices_tomorrow[0];

        for (float p : prices_tomorrow) {
          if (p > actual_max_tomorrow) actual_max_tomorrow = p;
          if (p < actual_min_tomorrow) actual_min_tomorrow = p;
          actual_sum_tomorrow += p;
        }
      }

      float actual_avg_tomorrow = prices_tomorrow.empty()
          ? 0.0f
          : (actual_sum_tomorrow / prices_tomorrow.size());


      // Hoisted variables to guarantee correct scope access
      float active_low = 0.0f;
      float active_high = 0.0f;
      float pct_low = id(threshold_pct_low).has_state() ? id(threshold_pct_low).state : 0.2f;
      float pct_high = id(threshold_pct_high).has_state() ? id(threshold_pct_high).state : 0.8f;

      bool use_percentage_mode = id(dynamic_threshold_switch).state;
      float static_low = id(threshold_static_low).state;
      float static_high = id(threshold_static_high).state;

      // Global min for chart scaling (min anchored at 0.0)
      float min_p = 0.0f;
      float max_p = actual_max; // reference for thresholds
      if (max_p == min_p) max_p = min_p + 1.0f;

      // Resolve active thresholds based on selected mode
      active_low = use_percentage_mode ? (max_p * pct_low) : static_low;
      active_high = use_percentage_mode ? (max_p * pct_high) : static_high;

      // ── Header color — based on current electricity price ────────────────
      Color header_color = id(color_blue);

      if (!prices_today.empty() && current_hour < prices_today.size()) {
        float current_price = prices_today[current_hour];

        if (current_price < active_low) {
          header_color = id(color_green);
        } else if (current_price > active_high) {
          header_color = id(color_red);
        } else {
          header_color = id(color_blue);
        }
      }

      // ── Header background ─────────────────────────────────────────────────
      it.filled_rectangle(0, 0, 600, 44, header_color);

      Color header_text_color = id(color_white);

      // ── Vertical centering in the 44px header ────────────────────────────
      // Center each font's line box (ascender + descender) in the header, then
      // baseline-align the small font to the main font so all text items share
      // one baseline.
      int main_y = (44 - (id(font_main).get_ascender() + id(font_main).get_descender())) / 2;
      int small_y = main_y + id(font_main).get_ascender() - id(font_small).get_ascender();

      // 1. Current Time (Header Left)
      if (time_now.is_valid()) {
        char time_str[32];
        time_now.strftime(time_str, sizeof(time_str), "%H:%M");
        it.print(15, small_y, id(font_small), header_text_color, TextAlign::TOP_LEFT, time_str);
      } else {
        it.print(15, small_y, id(font_small), header_text_color, TextAlign::TOP_LEFT, "--:--");
      }

      // ── Current price category marker and label ──────────────────────────
      if (!prices_today.empty() && current_hour < prices_today.size()) {
        float current_price = prices_today[current_hour];

        // Markers centered on the header midline (y=22), same as the MED circle
        if (current_price < active_low) {
          // LOW: smaller downward triangle
          it.filled_triangle(
            75, 12, 93, 12, 84, 32,
            id(color_white)
          );
        } else if (current_price > active_high) {
          // HIGH: smaller upward triangle
          it.filled_triangle(
            75, 32, 93, 32, 84, 12,
            id(color_white)
          );
        } else {
          // MED: smaller filled circle
          it.filled_circle(84, 22, 11, id(color_white));
        }
        // Current price next to the marker (c/kWh, same format as the chart)
        // e.g. "4.2 (+2.4 avg)" — diff vs today's average in small font,
        // baseline-aligned: offset by the ascent difference so the bottoms
        // of both texts sit level regardless of font sizes.
        char price_str[16];
        snprintf(price_str, sizeof(price_str), "%.1f", current_price);
        it.printf(100, main_y, id(font_main), id(color_white), TextAlign::TOP_LEFT, "%s", price_str);
        float diff = current_price - actual_avg_today;
        char diff_str[24];
        snprintf(diff_str, sizeof(diff_str), "(%+.1f avg)", diff);
        // Measure the price text so the diff sits right after it
        int tb_x1, tb_y1, tb_w, tb_h;
        it.get_text_bounds(0, 0, price_str, id(font_main), TextAlign::TOP_LEFT, &tb_x1, &tb_y1, &tb_w, &tb_h);
        int diff_x = 100 + tb_w + 4;
        // Bottom-aligned with the price (shared baseline)
        it.printf(diff_x, small_y, id(font_small), id(color_white), TextAlign::TOP_LEFT, "%s", diff_str);
      }

      // 2. Date (Header Exact Center) — e.g. "Sat, 17 Oct"
      if (time_now.is_valid()) {
        char date_str[32];
        time_now.strftime(date_str, sizeof(date_str), "%a, %d %b");
        it.print(300, main_y, id(font_main), header_text_color, TextAlign::TOP_CENTER, date_str);
      }

      // 3. WiFi Warning Icon (Header Right - Shown ONLY if there is a connection problem)
      float _wsig = id(wifi_signal_db).state;
      bool wifi_has_problem = isnan(_wsig) || _wsig < -75.0f;
      if (wifi_has_problem) {
        int wifi_y = (44 - (id(tabler_font).get_ascender() + id(tabler_font).get_descender())) / 2;
        it.print(440, wifi_y, id(tabler_font), id(color_red), TextAlign::TOP_LEFT, "\U0000ECFA");
      }

      // 4. Battery (Header Far Right)
      if (id(battery_pct).has_state()) {
        float pct = id(battery_pct).state;
        bool charging = id(usb_connected).state;
        Color bat_color = (charging || pct > 20) ? header_text_color : id(color_red);
        const char* bat_icon;
        if (charging) {
          if      (pct >= 95) bat_icon = "\U000F0085";
          else if (pct >= 85) bat_icon = "\U000F008B";
          else if (pct >= 75) bat_icon = "\U000F008A";
          else if (pct >= 65) bat_icon = "\U000F089E";
          else if (pct >= 55) bat_icon = "\U000F0089";
          else if (pct >= 45) bat_icon = "\U000F089D";
          else if (pct >= 35) bat_icon = "\U000F0088";
          else if (pct >= 25) bat_icon = "\U000F0087";
          else if (pct >= 15) bat_icon = "\U000F0086";
          else                bat_icon = "\U000F089C";
        } else {
          if      (pct >= 95) bat_icon = "\U000F0079";
          else if (pct >= 85) bat_icon = "\U000F0082";
          else if (pct >= 75) bat_icon = "\U000F0081";
          else if (pct >= 65) bat_icon = "\U000F0080";
          else if (pct >= 55) bat_icon = "\U000F007F";
          else if (pct >= 45) bat_icon = "\U000F007E";
          else if (pct >= 35) bat_icon = "\U000F007D";
          else if (pct >= 25) bat_icon = "\U000F007C";
          else if (pct >= 15) bat_icon = "\U000F007B";
          else if (pct >= 5)  bat_icon = "\U000F007A";
          else                bat_icon = "\U000F008E";
        }
        int bat_y = (44 - (id(icon_font).get_ascender() + id(icon_font).get_descender())) / 2;
        it.print(515, bat_y, id(icon_font), bat_color, TextAlign::TOP_LEFT, bat_icon);
        if (charging) {
          it.print(545, small_y, id(font_small), header_text_color, TextAlign::TOP_LEFT, "CHG");
        } else {
          it.printf(545, small_y, id(font_small), header_text_color, TextAlign::TOP_LEFT, "%.0f%%", pct);
        }
      }

      if (total_bars >= 24) {
        int chart_y = 60;
        int chart_x = 61;
        int bars_x = chart_x + 8;
        int chart_w = 480;
   
        bool show_legend = id(show_legend_switch).state;

        // Fully maximized heights with absolute zero slack
        int chart_h = 260;

        // Section titles centered over their bars
        int title_slot = chart_w / total_bars;
        if (has_tomorrow) {
          it.print(bars_x + 12 * title_slot, 45, id(font_small), id(color_black), TextAlign::TOP_CENTER, "Today");
          it.print(bars_x + 36 * title_slot, 45, id(font_small), id(color_black), TextAlign::TOP_CENTER, "Tomorrow");
        } else {
          it.print(bars_x + (total_bars * title_slot) / 2, 45, id(font_small), id(color_black), TextAlign::TOP_CENTER, "Today");
        }

        int label_offset = 16;  // y-label right edge, left of the tick marks
        int tick_x0 = chart_x - 10;
        int tick_x1 = chart_x - 2;

        // 2. Bottom Label (0) - Centered on baseline
        float norm_0 = (0.0 - min_p) / (max_scale - min_p);
        int y_0 = chart_y + chart_h - (int)(norm_0 * (chart_h - 10));
        // it.printf(chart_x - label_offset, y_0, id(font_small), id(color_black), TextAlign::CENTER_RIGHT, "0");

        // 3. Mid Label (15) - Centered on its mathematical scale position
        float norm_15 = (15.0 - min_p) / (max_scale - min_p);
        int y_15 = chart_y + chart_h - (int)(norm_15 * (chart_h - 10));
        it.printf(chart_x - label_offset, y_15, id(font_small), id(color_black), TextAlign::CENTER_RIGHT, "15");

        // Top Label (30 or actual extended max) - Centered precisely on its tick
        float norm_top = (max_scale - min_p) / (max_scale - min_p);
        int y_top = chart_y + chart_h - (int)(norm_top * (chart_h - 10));

        char top_label[20];
        if (is_extended) {
          snprintf(top_label, sizeof(top_label), "E %.0f", max_scale);
        } else {
          snprintf(top_label, sizeof(top_label), "%.0f", max_scale);
        }
        it.printf(chart_x - label_offset, y_top, id(font_small), id(color_black), TextAlign::CENTER_RIGHT, top_label);

        // Actual Peak Label: Always shown, vertically aligned with the top Y label (y_top),
        // but horizontally positioned *after* the Y label (inside the chart area at chart_x + 4)
        //it.printf(chart_x + 5, y_top, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "High %.1f", actual_max_today);
        //it.printf(chart_x + 5, y_top + 20, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "Low  %.1f", actual_min_today);
        //it.printf(chart_x + 5, y_top, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f | %.1f | %.1f", actual_max_today, actual_min_today, actual_avg_today);

        // ── Daily price statistics ────────────────────────────────────
        int stats_x_today = bars_x;
        int stats_x_tomorrow = bars_x + 24 * (chart_w / total_bars) + 8;
        int stats_y = y_top;
        
        // Row spacing and marker geometry
        int row_h = 16;
        int marker_half_w = 5;
        int marker_half_h = 4;
        
        // Text row positions
        int high_y = stats_y;
        int low_y = stats_y + row_h;
        int avg_y = stats_y + 2 * row_h;
        
        // Marker center positions: centered vertically in each text row
        int high_cy = high_y;
        int low_cy = low_y;
        int avg_cy = avg_y;
        
        // TODAY: ▲ High
        it.filled_triangle(stats_x_today, high_cy + marker_half_h, stats_x_today + marker_half_w * 2, high_cy + marker_half_h, stats_x_today + marker_half_w, high_cy - marker_half_h, id(color_red));
        it.printf(stats_x_today + 15, high_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_max_today);
        
        // TODAY: ▼ Low
        it.filled_triangle(stats_x_today, low_cy - marker_half_h, stats_x_today + marker_half_w * 2, low_cy - marker_half_h, stats_x_today + marker_half_w, low_cy + marker_half_h, id(color_green));
        it.printf(stats_x_today + 15, low_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_min_today);
        
        // TODAY: ● Average
        //it.filled_circle(stats_x_today + marker_half_w, avg_cy, 4, id(color_blue));
        //it.printf(stats_x_today + 15, avg_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_avg_today);
        
        // TOMORROW
        if (has_tomorrow) {
          it.filled_triangle(stats_x_tomorrow, high_cy + marker_half_h, stats_x_tomorrow + marker_half_w * 2, high_cy + marker_half_h, stats_x_tomorrow + marker_half_w, high_cy - marker_half_h, id(color_red));
          it.printf(stats_x_tomorrow + 15, high_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_max_tomorrow);
        
          it.filled_triangle(stats_x_tomorrow, low_cy - marker_half_h, stats_x_tomorrow + marker_half_w * 2, low_cy - marker_half_h, stats_x_tomorrow + marker_half_w, low_cy + marker_half_h, id(color_green));
          it.printf(stats_x_tomorrow + 15, low_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_min_tomorrow);
        
          //it.filled_circle(stats_x_tomorrow + marker_half_w, avg_cy, 4, id(color_blue));
          //it.printf(stats_x_tomorrow + 15, avg_y, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "%.1f", actual_avg_tomorrow);
        }

        // 5. Dynamic Moving Current Hour Price Label - Centered on its exact bar height
        float cur_norm = (chart_prices[current_hour] - min_p) / (max_scale - min_p);
        int cur_y_pos = chart_y + chart_h - (int)(cur_norm * (chart_h - 10));
        
        if (cur_y_pos < chart_y) cur_y_pos = chart_y;
        if (cur_y_pos > chart_y + chart_h) cur_y_pos = chart_y + chart_h;

        it.filled_rectangle(tick_x0, cur_y_pos, tick_x1 - tick_x0 + 1, 4, id(color_black));
        it.printf(chart_x - label_offset, cur_y_pos, id(font_small), id(color_black), TextAlign::CENTER_RIGHT, "%.1f", chart_prices[current_hour]);

        // 6. Y-Axis Ticks Every 5 Units from 0 up to max_scale (skipping 30 if too close in extended mode)
        for (int p = 0; p <= (int)max_scale; p += 5) {
          if (is_extended && (max_scale - p < 4)) {
            continue;
          }
          float step_norm = ((float)p - min_p) / (max_scale - min_p);
          int step_y = chart_y + chart_h - (int)(step_norm * (chart_h - 10));
          if (step_y >= chart_y && step_y <= chart_y + chart_h) {
            it.line(tick_x0, step_y, tick_x1, step_y, id(color_black));
          }
        }

        // ── Extended-scale warning stripes: LEFT Y-axis ticks ──────────────
        float standard_max = id(max_scale_config).has_state()
            ? id(max_scale_config).state : 30.0f;

        if (is_extended && max_scale > standard_max) {
          const int stripe_x = tick_x0;
          const int stripe_w = tick_x1 - tick_x0;
          
          float norm_standard = (standard_max - min_p) / (max_scale - min_p);
          int stripe_bottom = chart_y + chart_h
              - (int)(norm_standard * (chart_h - 10));

          for (int y = chart_y; y < stripe_bottom; y++) {
            for (int x = stripe_x; x < stripe_x + stripe_w; x++) {
              int pattern = ((x - stripe_x) + y) % 8;

              if (pattern < 3) {
                it.draw_pixel_at(
                  x, y,
                  ((x - stripe_x + y) / 8) % 2 == 0
                    ? id(color_red)
                    : id(color_yellow)
                );
              }
            }
          }
        }

        // Baseline axis line
        it.line(bars_x, chart_y + chart_h, bars_x + chart_w, chart_y + chart_h, id(color_black));

        // Fixed Vertical Divider Line
        if (has_tomorrow) {
          int div_x = bars_x + (24 * (chart_w / total_bars));
          it.line(div_x, chart_y, div_x, chart_y + chart_h, id(color_blue));

          //it.printf(div_x + 5, y_top, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "High %.1f", actual_max_tomorrow);
          //it.printf(div_x + 5, y_top + 20, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "Low  %.1f", actual_min_tomorrow);
          //it.printf(div_x + 5, y_top, id(font_small), id(color_black), TextAlign::CENTER_LEFT, "High %.1f | Low %.1f | Avg %.1f", actual_max_tomorrow, actual_min_tomorrow, actual_avg_tomorrow);
        }

        int slot_w = chart_w / total_bars;
        int bar_gap = 2;
        int bar_w = slot_w - bar_gap;
        if (bar_w < 2) bar_w = 2;

        for (int i = 0; i < total_bars; i++) {
          int bx = bars_x + (i * slot_w) + (bar_gap / 2);
          
          // CRITICAL FIX: Use max_scale instead of max_p so bars scale down correctly!
          float norm = (chart_prices[i] - min_p) / (max_scale - min_p);
          int b_h = (int)(norm * (chart_h - 10)) + 2;
          int by = chart_y + chart_h - b_h;

          Color b_col = id(color_blue);
          if (chart_prices[i] < active_low) {
            b_col = id(color_green);
          } else if (chart_prices[i] > active_high) {
            b_col = id(color_red);
          }
          it.filled_rectangle(bx, by, bar_w, b_h, b_col);

          // 1. 3-hour tick mark (length 6)
          if (i % 3 == 0 && i % 6 != 0) {
            it.line(bx + (bar_w / 2), chart_y + chart_h, bx + (bar_w / 2), chart_y + chart_h + 6, id(color_black));
          }

          // 2. 6-hour interval ticks (length 8) and labels (omitting 00)
          if (i % 6 == 0) {
            it.line(bx + (bar_w / 2), chart_y + chart_h, bx + (bar_w / 2), chart_y + chart_h + 8, id(color_black));
            if (i % 24 != 0) {
              char h_str[8];
              snprintf(h_str, sizeof(h_str), "%02d", i % 24);
              it.print(bx + (bar_w / 2), chart_y + chart_h + 9, id(font_small), id(color_black), TextAlign::TOP_CENTER, h_str);
            }
          }

          // 3. Current hour emphasis (Thick underscore ticker)
          if (i == current_hour) {
            it.filled_rectangle(bx, chart_y + chart_h + 3, bar_w, 4, id(color_black));
          }
        }

        // ── Extended-scale warning strip: maximum 10 px wide ───────────────
        if (is_extended) {
          const int stripe_x = 580;
          const int stripe_w = 10;
          const int stripe_top = chart_y;
          const int stripe_bottom = chart_y + chart_h;

          for (int y = stripe_top; y < stripe_bottom; y++) {
            for (int x = stripe_x; x < stripe_x + stripe_w; x++) {
              // Diagonal red/yellow stripes, clipped to the 10 px strip
              int pattern = ((x - stripe_x) + y) % 8;

              if (pattern < 3) {
                it.draw_pixel_at(
                  x, y,
                  ((x - stripe_x + y) / 8) % 2 == 0
                    ? id(color_red)
                    : id(color_yellow)
                );
              }
            }
          }
        }

        // ── Legend: stacked in the free strip right of the chart, rows aligned with the High/Low stats ──
        // White backing keeps it legible over the extended-scale warning stripe.
        if (show_legend) {
          const int leg_box = 10;
          const int leg_gap = 2;
          const bool with_pct = id(dynamic_threshold_switch).state;

          char s_hi[16], s_lo[16], p_hi[8], p_lo[8];
          snprintf(s_hi, sizeof(s_hi), ">%.0f", active_high);
          snprintf(s_lo, sizeof(s_lo), "<%.0f", active_low);
          snprintf(p_hi, sizeof(p_hi), "%.0f%%", pct_high * 100.0f);
          snprintf(p_lo, sizeof(p_lo), "%.0f%%", pct_low * 100.0f);

          const char *texts[4] = {s_hi, s_lo, p_hi, p_lo};
          int max_tw = 0;
          for (int i = 0; i < (with_pct ? 4 : 2); i++) {
            int bx, by, bw, bh;
            it.get_text_bounds(0, 0, texts[i], id(font_small), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
            if (bw > max_tw) max_tw = bw;
          }

          int leg_x = 590 - (leg_box + leg_gap + max_tw);
          if (leg_x < bars_x + chart_w + 1) leg_x = bars_x + chart_w + 1;
          const int tx = leg_x + leg_box + leg_gap;
          const int n_rows = with_pct ? 4 : 2;
          const int lo_row = with_pct ? 2 : 1;

          it.filled_rectangle(leg_x - 1, y_top - row_h / 2, 600 - (leg_x - 1), n_rows * row_h, id(color_white));

          it.filled_rectangle(leg_x, y_top - leg_box / 2, leg_box, leg_box, id(color_red));
          it.print(tx, y_top, id(font_small), id(color_black), TextAlign::CENTER_LEFT, s_hi);
          if (with_pct) {
            it.print(tx, y_top + row_h, id(font_small), id(color_black), TextAlign::CENTER_LEFT, p_hi);
          }

          it.filled_rectangle(leg_x, y_top + lo_row * row_h - leg_box / 2, leg_box, leg_box, id(color_green));
          it.print(tx, y_top + lo_row * row_h, id(font_small), id(color_black), TextAlign::CENTER_LEFT, s_lo);
          if (with_pct) {
            it.print(tx, y_top + 3 * row_h, id(font_small), id(color_black), TextAlign::CENTER_LEFT, p_lo);
          }
        }

      } else {
        it.print(300, 180, id(font_main), id(color_red), TextAlign::TOP_CENTER, "Waiting for Nord Pool price data...");
      }

      // ── Ultra-Tight Divider Position (Immediately below X labels) ─────────
      const int dynamic_divider_y = 352;
      it.horizontal_line(15, dynamic_divider_y, 570, id(color_blue));

      // ── Bottom Row (Footer Y: Tightened right below divider) ───────────────
      int footer_y = dynamic_divider_y + 10;
      const int vcy = footer_y + 21;  // vertical centre of the forecast value row (below the time labels)
      const int scy = footer_y + 16;  // outdoor/room sensor row; bottoms line up with the forecast icons

      // 1. Outdoor Weather Icon & Temp (Bottom Left)
      it.print(15, scy, id(icon_font), id(color_black), TextAlign::CENTER_LEFT, "\U000F050F");
      char out_str[16] = "--";
      if (id(ha_outdoor_temp).has_state()) {
        snprintf(out_str, sizeof(out_str), "%.1f°C", id(ha_outdoor_temp).state);
      }
      it.print(44, scy, id(font_small), id(ha_outdoor_temp).has_state() ? id(color_black) : id(color_red), TextAlign::CENTER_LEFT, out_str);
      int outdoor_end = 44;
      {
        int bx, by, bw, bh;
        it.get_text_bounds(0, 0, out_str, id(font_small), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        outdoor_end += bw;
      }

      // 2. Weather forecast (Bottom Middle): six slots from the 00/09/12/15/18/21 grid, last item always tomorrow; a divider where the day changes
      const int wx_lbl_cy = footer_y + 5;
      const int wx_lbl_dx = -4;  // nudge weekday labels left of the icon+temp midpoint; plain HH labels get 2 px more
      const int wx_pitch = 58;
      const int wx_pipe_gap = 16;
      {
        auto split = [](const std::string &s, char sep) {
          std::vector<std::string> out;
          size_t st = 0, en;
          while ((en = s.find(sep, st)) != std::string::npos) {
            out.push_back(s.substr(st, en - st));
            st = en + 1;
          }
          out.push_back(s.substr(st));
          return out;
        };
        auto part = [](const std::vector<std::string> &v, size_t i) -> std::string {
          return i < v.size() ? v[i] : std::string();
        };
        auto to_f = [](const std::string &s) -> float {
          return s.empty() ? NAN : strtof(s.c_str(), nullptr);
        };
        auto fmt_t = [](float v) -> std::string {
          if (std::isnan(v)) return "--";
          v = roundf(v);
          if (v == 0.0f) v = 0.0f;  // avoid "-0"
          char b[16];
          snprintf(b, sizeof(b), "%.0f°", v);
          return b;
        };
        auto wx_icon = [](const std::string &c) -> const char * {
          if (c == "sunny") return "\U000F0599";
          if (c == "clear-night") return "\U000F0594";
          if (c == "partlycloudy") return "\U000F0595";
          if (c == "cloudy") return "\U000F0590";
          if (c == "rainy") return "\U000F0597";
          if (c == "pouring") return "\U000F0596";
          if (c == "snowy") return "\U000F0598";
          if (c == "snowy-rainy") return "\U000F067F";
          if (c == "fog") return "\U000F0591";
          if (c == "hail") return "\U000F0592";
          if (c == "lightning") return "\U000F0593";
          if (c == "lightning-rainy") return "\U000F067E";
          if (c == "windy") return "\U000F059D";
          if (c == "windy-variant") return "\U000F059E";
          if (c == "exceptional") return "\U000F0F2F";
          return "";
        };
        auto label_dx = [&](const std::string &l) -> int {
          return l.find(' ') != std::string::npos ? wx_lbl_dx : wx_lbl_dx - 2;
        };
        auto text_w = [&](const std::string &s) -> int {
          int bx, by, bw, bh;
          it.get_text_bounds(0, 0, s.c_str(), id(font_tiny), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          return bw;
        };
        auto draw_item = [&](int x, const std::string &label, const std::string &cond, float temp) {
          const std::string temp_str = fmt_t(temp);
          // Label centred over the actual icon + temperature span
          it.print(x + (24 + text_w(temp_str)) / 2 + label_dx(label), wx_lbl_cy, id(font_tiny), id(color_black), TextAlign::CENTER, label.c_str());
          it.print(x, vcy, id(weather_icon_font), id(color_black), TextAlign::CENTER_LEFT, wx_icon(cond));
          it.print(x + 24, vcy, id(font_tiny), id(color_black), TextAlign::CENTER_LEFT, temp_str.c_str());
        };

        // Lay out relative to 0 first, then centre the block between the outdoor text and the room icon
        std::string labels[6], conds[6];
        float temps[6];
        int rel_x[6] = {0, 0, 0, 0, 0, 0};
        bool pipe_before[6] = {false, false, false, false, false, false};

        std::vector<std::string> entries = split(id(wx_hourly), ';');
        for (int i = 0; i < 6; i++) {
          std::vector<std::string> f = split(part(entries, i), ',');
          labels[i] = part(f, 0);
          conds[i] = part(f, 1);
          temps[i] = to_f(part(f, 2));
          if (i > 0) rel_x[i] = rel_x[i - 1] + wx_pitch;
          // A weekday label marks the first slot of a new day: add a light dotted divider before it
          if (labels[i].find(' ') != std::string::npos) {
            rel_x[i] += wx_pipe_gap;
            pipe_before[i] = true;
          }
        }

        int last_bx, last_by, last_bw, last_bh;
        it.get_text_bounds(0, 0, fmt_t(temps[5]).c_str(), id(font_tiny), TextAlign::TOP_LEFT, &last_bx, &last_by, &last_bw, &last_bh);
        const int block_w = rel_x[5] + 24 + last_bw;
        const int room_icon_x = 505;
        const int base_x = outdoor_end + ((room_icon_x - outdoor_end) - block_w) / 2;

        for (int i = 0; i < 6; i++) {
          if (pipe_before[i]) {
            // Centre the divider between the previous item's right edge and this item's left edge (icon or label)
            const int prev_x = base_x + rel_x[i - 1];
            const int prev_tw = text_w(fmt_t(temps[i - 1]));
            const int prev_lbl_right = prev_x + (24 + prev_tw) / 2 + label_dx(labels[i - 1]) + text_w(labels[i - 1]) / 2;
            const int prev_right = std::max(prev_x + 24 + prev_tw, prev_lbl_right);
            const int next_x = base_x + rel_x[i];
            const int next_lbl_left = next_x + (24 + text_w(fmt_t(temps[i]))) / 2 + label_dx(labels[i]) - text_w(labels[i]) / 2;
            const int next_left = std::min(next_x, next_lbl_left);
            const int pipe_x = (prev_right + next_left) / 2;
            for (int y = footer_y + 1; y < footer_y + 29; y += 2) {
              it.draw_pixel_at(pipe_x, y, id(color_black));
            }
          }
          draw_item(base_x + rel_x[i], labels[i], conds[i], temps[i]);
        }
      }

      it.print(505, scy, id(icon_font), id(color_black), TextAlign::CENTER_LEFT, "\U000F02DC");
      
      char room_str[32];
      if (!isnan(id(local_temp).state)) {
        snprintf(room_str, sizeof(room_str), "%.1f°C", id(local_temp).state);
      } else {
        snprintf(room_str, sizeof(room_str), "--");
      }
      it.print(585, scy, id(font_small), id(color_black), TextAlign::CENTER_RIGHT, room_str);
      
# ── Interval refresh (USB only) ───────────────────────────────────────────────
# When on USB power, deep sleep is prevented and the wake/sleep cycle stops.
# This interval fires every minute and triggers a refresh when the configured USB interval has elapsed.
# It's a no-op on battery because the device is asleep between refreshes.

interval:
  - interval: 1min
    then:
      - if:
          condition:
            lambda: |-
              return id(usb_connected).state &&
                     !id(epd_refresh_in_progress) &&
                     (millis() - id(last_usb_refresh_ms)) >= (uint32_t)(id(usb_refresh_mins).state * 60000.0f);
          then:
            - lambda: 'id(last_usb_refresh_ms) = millis();'
            - logger.log: "Interval refresh — USB connected"
            - script.execute: fetch_weather
            - script.wait: fetch_weather
            - component.update: battery_mv
            - component.update: wifi_signal_db
            - component.update: m5_color_screen

# ── Diagnostics ───────────────────────────────────────────────────────────────

text_sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    name: "Build DateTime"
    id: build_date_sensor
    update_interval: never
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    lambda: 'return {__DATE__ " " __TIME__};'

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic

  - platform: template
    name: "Last Reset Reason"
    id: reset_reason
    entity_category: diagnostic
    icon: "mdi:restart-alert"
    update_interval: never
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:   return {"Power On"};
        case ESP_RST_EXT:       return {"External Pin"};
        case ESP_RST_SW:        return {"Software"};
        case ESP_RST_PANIC:     return {"Panic / Exception"};
        case ESP_RST_INT_WDT:   return {"Interrupt Watchdog"};
        case ESP_RST_TASK_WDT:  return {"Task Watchdog"};
        case ESP_RST_WDT:       return {"Watchdog (other)"};
        case ESP_RST_DEEPSLEEP: return {"Deep Sleep Wake"};
        case ESP_RST_BROWNOUT:  return {"Brownout"};
        default:                return {"Unknown"};
      }

  - platform: homeassistant
    id: nordpool_prices_csv
    entity_id: !secret ha_nordpool_entity
    attribute: prices
    on_value:
      then:
        - logger.log: "Received Nord Pool CSV"


  - platform: homeassistant
    id: nordpool_tomorrow_csv
    entity_id: !secret ha_nordpool_entity
    attribute: prices_tomorrow

# ── Sleep / Wake ──────────────────────────────────────────────────────────────
# Wake cycle: PMIC timer fires → cold boot → WiFi → sensors → display → PMIC shutdown
# On-demand wake: press physical power button S4 (PMIC-side) → same cold boot sequence.
# OTA: press S4, wait for blue boot flash, then initiate OTA from HA within ~60s.
# (Button B / GPIO9 no longer wakes — ESP32 is fully powerless during PMIC shutdown.)
